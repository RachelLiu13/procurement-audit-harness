# Fly.io: one app serves the website (web/) and the agent API (/api).
# Deploy: fly launch --no-deploy (keep this file), fly secrets set ..., fly deploy. See DEPLOY.md.
app = "procurement-audit-harness"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[env]
  CLAUDE_MODEL = "claude-opus-5-5"
  CLAUDE_EFFORT = "medium"
  RUNS_DIR = "/data/runs"

# A run lasts 30–60 minutes and waits on the auditor at two gates, so the machine never auto-stops.
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "10s"
    grace_period = "20s"

# Runs (including ones waiting at a gate) survive restarts and redeploys.
[mounts]
  source = "runs_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  memory = "2gb"
  cpus = 1
