# fly.toml app configuration file generated for procurement-audit-harness on 2026-10-15T22:55:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'procurement-audit-harness'
primary_region = 'lax'

[build]
  dockerfile = 'part-b/Dockerfile'

[env]
  CLAUDE_EFFORT = 'medium'
  CLAUDE_MODEL = 'claude-opus-5-5'
  RUNS_DIR = '/data/runs'

[[mounts]]
  source = 'runs_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
