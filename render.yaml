# Render Blueprint: one free Docker web service running server.py.
services:
  - type: web
    name: audit-planner-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    # Redeploying wipes the runs stored on the free instance, so changes to the
    # Vercel site, the docs or the tests do not redeploy the agent server.
    buildFilter:
      ignoredPaths:
        - web/**
        - tests/**
        - "*.md"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      - key: CLAUDE_EFFORT
        value: medium
